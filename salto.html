<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventura Hñähñu</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #faf7f2; /* Fondo crema cálido de la captura */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* Tarjeta principal estilo contenedor de la captura */
.tarjeta-juego {
    background-color: #be8684; /* Tono terracota / rosa antiguo */
    width: 960px;
    max-width: 100%;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(107, 62, 60, 0.15);
    text-align: center;
    color: #ffffff;
}

.subtitulo {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.9;
    margin-bottom: 5px;
    font-weight: 600;
}

h1 {
    color: #ffffff;
    font-size: 32px;
    margin-bottom: 20px;
    font-weight: 700;
}

#contenedor {
    width: 100%;
    margin: auto;
    position: relative;
}

canvas {
    width: 100%;
    background: linear-gradient(#f5ebe0, #e6ccb2); /* Cielo cálido acorde a la paleta */
    border: 3px solid rgba(255, 255, 255, 0.4);
    border-radius: 15px;
    display: block;
}

#menu {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(140, 88, 86, 0.92); /* Overlay terracota oscuro */
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 15px;
    gap: 18px;
}

#menu h2 {
    font-size: 34px;
}

#menu p {
    color: #f5ebe0;
    font-size: 16px;
    font-weight: normal;
}

/* Botones estilo "COMPROBAR" y "VOLVER A JUEGOS" de la captura */
.controles-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    flex-wrap: wrap;
    gap: 15px;
}

.instrucciones {
    background: rgba(255, 255, 255, 0.15);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    letter-spacing: 0.5px;
    color: #ffffff;
}

.btn-primario {
    background-color: #f5ebe0;
    color: #7d4f4d;
    border: none;
    padding: 14px 32px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: transform 0.15s, background-color 0.2s;
}

.btn-primario:hover {
    background-color: #ffffff;
    transform: translateY(-2px);
}

.btn-secundario {
    background-color: transparent;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.75);
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.2s;
}

.btn-secundario:hover {
    background-color: rgba(255, 255, 255, 0.15);
}
</style>
</head>

<body>

<div class="tarjeta-juego">
    <div class="subtitulo">JUEGO DE PLATAFORMAS</div>
    <h1>Aventura Hñähñu</h1>

    <div id="contenedor">
        <canvas id="juego" width="900" height="460"></canvas>

        <div id="menu">
            <h2 id="titulo">Aventura Hñähñu</h2>
            <p>Recolecta corazones y llega a la meta.</p>
            <button class="btn-primario" onclick="iniciar()">JUGAR</button>
        </div>
    </div>

    <div class="controles-footer">
        <div class="instrucciones">⬅️ ➡️ Mover &nbsp;|&nbsp; ESPACIO Saltar</div>
        <a href="juegos.html" class="btn-secundario">VOLVER A JUEGOS</a>
    </div>
</div>

<script>
const canvas = document.getElementById("juego");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const titulo = document.getElementById("titulo");

let jugador;
let plataformas;
let corazones;
let obstaculos;
let teclas = {};
let puntos = 0;
let vidas = 3;
let jugando = false;
let camara = 0;
let meta = 3500;

const gravedad = 0.6;

function iniciar() {
    puntos = 0;
    vidas = 3;
    camara = 0;

    jugador = {
        x: 50,
        y: 320,
        w: 35,
        h: 45,
        vx: 0,
        vy: 0,
        suelo: false
    };

    plataformas = [
        {x:0,y:400,w:400,h:60},
        {x:500,y:340,w:180,h:30},
        {x:780,y:290,w:180,h:30},
        {x:1100,y:370,w:300,h:60},
        {x:1500,y:310,w:200,h:30},
        {x:1800,y:260,w:180,h:30},
        {x:2100,y:390,w:350,h:60},
        {x:2600,y:320,w:200,h:30},
        {x:3000,y:370,w:600,h:60}
    ];

    corazones = [
        {x:250,y:320},
        {x:570,y:270},
        {x:850,y:220},
        {x:1200,y:300},
        {x:1550,y:250},
        {x:1850,y:200},
        {x:2200,y:320},
        {x:2650,y:260},
        {x:3200,y:300}
    ];

    obstaculos = [
        {x:600,y:315,w:30,h:25},
        {x:1250,y:345,w:35,h:25},
        {x:2250,y:365,w:35,h:25},
        {x:3150,y:345,w:35,h:25}
    ];

    jugando = true;
    menu.style.display = "none";

    actualizar();
}

// DIBUJAR JUGADOR
function dibujarJugador() {
    let x = jugador.x - camara;
    let y = jugador.y;

    // Cabello
    ctx.fillStyle = "#3d2624";
    ctx.fillRect(x+5,y,25,15);
    ctx.fillRect(x,y+10,35,25);

    // Cara
    ctx.fillStyle = "#f2c19d";
    ctx.fillRect(x+8,y+10,20,20);

    // Ojos
    ctx.fillStyle = "#2b1b1a";
    ctx.fillRect(x+12,y+17,3,4);
    ctx.fillRect(x+22,y+17,3,4);

    // Blusa tradicional
    ctx.fillStyle = "#faf7f2";
    ctx.fillRect(x+5,y+30,25,10);

    // Falda (tono terracota)
    ctx.fillStyle = "#a35d5b";
    ctx.fillRect(x+2,y+38,31,7);

    // Piernas
    ctx.fillStyle = "#3d2624";
    ctx.fillRect(x+8,y+45,6,8);
    ctx.fillRect(x+22,y+45,6,8);

    // Moño
    ctx.fillStyle = "#d97b78";
    ctx.fillRect(x+25,y+3,10,5);
}

// DIBUJAR ESCENARIO (Armonizado con tonos tierra y crema)
function dibujarMundo() {
    ctx.clearRect(0,0,900,460);

    // Montañas en tonos terracota suave
    ctx.fillStyle = "#d8b4a6";
    ctx.beginPath();
    ctx.moveTo(0,350);
    ctx.lineTo(200,110);
    ctx.lineTo(400,350);
    ctx.lineTo(600,130);
    ctx.lineTo(850,350);
    ctx.lineTo(900,250);
    ctx.lineTo(900,460);
    ctx.lineTo(0,460);
    ctx.fill();

    // Nubes crema
    ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
    ctx.fillRect(100,75,100,22);
    ctx.fillRect(130,58,60,22);
    ctx.fillRect(600,90,120,22);

    // Plataformas
    plataformas.forEach(p => {
        let x = p.x-camara;

        // Tierra
        ctx.fillStyle = "#8c5856";
        ctx.fillRect(x,p.y,p.w,p.h);

        // Borde superior arena/crema
        ctx.fillStyle = "#d4a373";
        ctx.fillRect(x,p.y,p.w,10);

        ctx.fillStyle = "#faedcd";
        for(let i=0;i<p.w;i+=20){
            ctx.fillRect(x+i,p.y-2,10,4);
        }
    });

    // Obstáculos (Piedras oscuras)
    obstaculos.forEach(o => {
        let x = o.x - camara;
        ctx.fillStyle = "#5c3735";
        ctx.beginPath();
        ctx.moveTo(x, o.y + o.h);
        ctx.lineTo(x + o.w / 2, o.y);
        ctx.lineTo(x + o.w, o.y + o.h);
        ctx.fill();
    });

    // Corazones
    corazones.forEach(c => {
        ctx.font = "28px Arial";
        ctx.fillText("❤️",c.x-camara,c.y);
    });

    // Meta
    ctx.fillStyle = "#7d4f4d";
    ctx.fillRect(meta-camara,250,8,150);

    ctx.font = "38px Arial";
    ctx.fillText("🏁",meta-camara-15,250);

    dibujarJugador();

    // HUD
    ctx.fillStyle = "#7d4f4d";
    ctx.font = "bold 20px 'Segoe UI', Arial";
    ctx.fillText("❤️ Vidas: "+vidas,20,35);
    ctx.fillText("⭐ Puntos: "+puntos,740,35);
}

// COLISIONES
function colision(a,b) {
    return a.x < b.x+b.w &&
           a.x+a.w > b.x &&
           a.y < b.y+b.h &&
           a.y+a.h > b.y;
}

// ACTUALIZAR JUGADOR
function mover() {
    jugador.vx = 0;

    if(teclas["ArrowRight"]) jugador.vx = 5;
    if(teclas["ArrowLeft"]) jugador.vx = -5;

    jugador.x += jugador.vx;
    jugador.vy += gravedad;
    jugador.y += jugador.vy;

    jugador.suelo = false;

    plataformas.forEach(p => {
        if(colision(jugador,p) && jugador.vy >= 0 &&
           jugador.y+jugador.h-jugador.vy <= p.y+5) {

            jugador.y = p.y-jugador.h;
            jugador.vy = 0;
            jugador.suelo = true;
        }
    });

    // CAER
    if(jugador.y > 500) perderVida();

    // CORAZONES
    corazones = corazones.filter(c => {
        let objeto = {x:c.x,y:c.y-20,w:25,h:25};

        if(colision(jugador,objeto)) {
            puntos += 10;
            return false;
        }
        return true;
    });

    // OBSTACULOS
    obstaculos.forEach(o => {
        if(colision(jugador,o)) perderVida();
    });

    // META
    if(jugador.x >= meta) finalizar(true);

    // CAMARA
    camara = jugador.x-200;
    if(camara < 0) camara = 0;
}

// PERDER VIDA
function perderVida() {
    vidas--;

    jugador.x = Math.max(50, jugador.x - 100);
    jugador.y = 250;
    jugador.vy = 0;

    if(vidas <= 0) finalizar(false);
}

// FINAL
function finalizar(victoria) {
    jugando = false;
    menu.style.display = "flex";

    if(victoria) {
        titulo.innerText = "🎉 ¡GANASTE! 🎉";
    } else {
        titulo.innerText = "💔 INTÉNTALO DE NUEVO";
    }

    menu.querySelector("p").innerText = "Puntuación final: " + puntos;
    menu.querySelector("button").innerText = "VOLVER A JUGAR";
}

// BUCLE
function actualizar() {
    if(!jugando) return;

    mover();
    dibujarMundo();

    requestAnimationFrame(actualizar);
}

// TECLADO
document.addEventListener("keydown", e => {
    teclas[e.key] = true;

    if(e.code === "Space" && jugador && jugador.suelo) {
        jugador.vy = -13;
        jugador.suelo = false;
    }
});

document.addEventListener("keyup", e => {
    teclas[e.key] = false;
});

// INICIO
dibujarMundo();
</script>

</body>
</html>
